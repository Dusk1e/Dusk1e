<svg viewBox="0 0 1000 300" width="1000" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dusk">
  <defs>
    <!-- rounded card clip -->
    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="300" rx="16"/>
    </clipPath>

    <!-- twilight sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#05070f"/>
      <stop offset="0.50" stop-color="#10162e"/>
      <stop offset="0.76" stop-color="#2c1d47"/>
      <stop offset="0.93" stop-color="#5b2c33"/>
      <stop offset="1"    stop-color="#8a3f24"/>
    </linearGradient>

    <!-- sun disc -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffd9a0"/>
      <stop offset="0.55" stop-color="#ff9a4d"/>
      <stop offset="1"   stop-color="#e05a26"/>
    </radialGradient>

    <!-- glow around the sinking sun -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ff9a4d" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff7a33" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#ff7a33" stop-opacity="0"/>
    </radialGradient>

    <!-- horizon line -->
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff9d5c" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#ffb47a" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#ff9d5c" stop-opacity="0"/>
    </linearGradient>

    <!-- ember shimmer on the ground -->
    <radialGradient id="emberGround" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>

    <!-- shooting star trail -->
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe2f7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dbe2f7" stop-opacity="0"/>
    </linearGradient>

    <!-- reflection fade -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflectFade">
      <rect x="0" y="210" width="1000" height="70" fill="url(#fade)"/>
    </mask>

    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="1000" height="210"/>
    </clipPath>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace">

    <!-- sky -->
    <rect x="0" y="0" width="1000" height="210" fill="url(#sky)"/>
    <!-- ground -->
    <rect x="0" y="210" width="1000" height="90" fill="#030509"/>
    <ellipse cx="500" cy="210" rx="380" ry="70" fill="url(#emberGround)"/>

    <!-- stars -->
    <g fill="#dbe2f7">
      <circle cx="82"  cy="52"  r="1.4"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <circle cx="164" cy="118" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2"  dur="5.1s" begin="-2.1s" repeatCount="indefinite"/></circle>
      <circle cx="238" cy="38"  r="1.6"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="90"  r="1.0"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.8s" begin="-3.0s" repeatCount="indefinite"/></circle>
      <circle cx="405" cy="46"  r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2"  dur="4.4s" begin="-0.2s" repeatCount="indefinite"/></circle>
      <circle cx="512" cy="72"  r="1.1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.4s" begin="-2.6s" repeatCount="indefinite"/></circle>
      <circle cx="596" cy="34"  r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.9s" begin="-1.8s" repeatCount="indefinite"/></circle>
      <circle cx="668" cy="104" r="1.0"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.0s" begin="-0.9s" repeatCount="indefinite"/></circle>
      <circle cx="748" cy="58"  r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2"  dur="4.1s" begin="-3.4s" repeatCount="indefinite"/></circle>
      <circle cx="836" cy="120" r="1.1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.7s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="906" cy="44"  r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.7s" begin="-2.9s" repeatCount="indefinite"/></circle>
      <circle cx="954" cy="140" r="1.0"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.6s" begin="-0.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shooting star -->
    <g opacity="0">
      <line x1="0" y1="0" x2="76" y2="-24" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="880 48; 630 126; 630 126" keyTimes="0;0.12;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.12;1" dur="11s" repeatCount="indefinite"/>
    </g>

    <!-- sinking sun -->
    <g clip-path="url(#aboveHorizon)">
      <circle cx="500" cy="212" r="150" fill="url(#glow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="212" r="48" fill="url(#sun)"/>
    </g>

    <!-- horizon line -->
    <rect x="60" y="209.4" width="880" height="1.2" fill="url(#horizon)"/>

    <!-- eyebrow -->
    <text x="500" y="92" text-anchor="middle" font-size="15" letter-spacing="6" fill="#7d87ad">ONCHAIN RESEARCH · OPEN SOURCE</text>

    <!-- wordmark: warm rim glow behind, then the word itself, baseline on the horizon -->
    <text x="500" y="200" text-anchor="middle" font-size="94" font-weight="600" letter-spacing="8" fill="#ffb47a" opacity="0.35" filter="url(#soft)">dusk</text>
    <text x="500" y="200" text-anchor="middle" font-size="94" font-weight="600" letter-spacing="8" fill="#eef1fb">dusk</text>

    <!-- reflection below the horizon -->
    <g mask="url(#reflectFade)">
      <text x="500" y="220" text-anchor="middle" font-size="94" font-weight="600" letter-spacing="8" fill="#aeb6d6" transform="matrix(1 0 0 -1 0 440)" filter="url(#soft2)">dusk</text>
    </g>

    <!-- card border -->
    <rect x="0.5" y="0.5" width="999" height="299" rx="15.5" fill="none" stroke="#1c2333"/>
  </g>
</svg>
