<svg viewBox="0 0 760 240" width="760" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DUSK">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b14"/>
      <stop offset="1" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.5" cy="0.82" r="0.72">
      <stop offset="0" stop-color="#6a4a9c" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#3a2a5a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3a2a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4cde4"/>
    </linearGradient>
    <linearGradient id="gleam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="clip">
      <text x="380" y="126" text-anchor="middle" dominant-baseline="central"
            font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800"
            font-size="96" letter-spacing="14">DUSK</text>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="752" height="232" rx="18" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.05"/>
  <rect x="4" y="4" width="752" height="232" rx="18" fill="url(#dusk)"/>

  <rect x="250" y="170" width="260" height="1.4" fill="#caa15a">
    <animate attributeName="opacity" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g fill="#ffffff">
    <circle cx="150" cy="70" r="1.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="64" r="1.2"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="4.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="604" cy="182" r="1.2"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="380" y="126" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800"
        font-size="96" letter-spacing="14" fill="#9aa6ff" filter="url(#glow)" opacity="0.25">DUSK<animate attributeName="opacity" values="0.16;0.42;0.16" dur="5s" repeatCount="indefinite"/></text>

  <text x="380" y="126" text-anchor="middle" dominant-baseline="central"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800"
        font-size="96" letter-spacing="14" fill="url(#ink)">DUSK</text>

  <g clip-path="url(#clip)">
    <rect x="120" y="48" width="90" height="156" fill="url(#gleam)">
      <animateTransform attributeName="transform" type="translate"
        values="-180 0; 520 0; 520 0" keyTimes="0;0.45;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
